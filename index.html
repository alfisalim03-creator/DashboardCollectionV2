<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pencapaian Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet.js & MarkerCluster untuk Peta Interaktif -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
   <!-- ============================================================
  PATCH UX: TAB PROGRES TAGIHAN
  Tempel blok <style> + <script> ini di file dashboard Anda,
  tepat sebelum </body> dan SESUDAH <script> utama (yang berisi WEB_APP_URL).
  Tidak perlu mengubah kode lain, kecuali 2 perubahan manual di bagian bawah.
============================================================ -->
<style>
  /* keterbacaan: teks kecil jadi 12px dan lebih kontras */
  #progresContainer .text-slate-400 { color: #64748b; }
  #progresContainer .text-\[11px\] { font-size: 12px; }
  /* transisi filter lebih cepat */
  #dashboardWrapper { transition-duration: .15s; }
  /* kartu perbandingan bulan lalu pindah jadi badge di kartu Lunas */
  #momSummaryCard { display: none !important; }

  @media (min-width: 768px) {
    #uxFilter { position: sticky; top: 8px; z-index: 40; }
    #secKpi, #secTren, #progresMapMount, #secBoard { scroll-margin-top: 170px; }
  }
  .ux-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    background: #fff1f2; border: 1px solid #fecdd3; color: #be123c; font-size: 12px; font-weight: 600; }
  .ux-chip.base { background: #f1f5f9; border-color: #e2e8f0; color: #334155; }
  .ux-chip button { font-size: 15px; line-height: 1; }
  .ux-btn { padding: 6px 10px; border-radius: 10px; border: 1px solid #e2e8f0; background: #fff;
    font-size: 12px; font-weight: 600; color: #475569; }
  .ux-btn:hover { background: #f1f5f9; }
  .ux-btn:focus-visible, #secBoard tr:focus-visible { outline: 2px solid #f43f5e; outline-offset: 2px; }

  /* leaderboard jadi kartu di layar kecil */
  @media (max-width: 640px) {
    #secBoard table { min-width: 0 !important; }
    #secBoard thead { display: none; }
    #secBoard tbody tr { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; padding: 10px 4px; }
    #secBoard tbody td { display: block; width: auto !important; text-align: left !important; padding: 2px 8px !important; }
    #secBoard tbody td:first-child { grid-column: 1 / -1; }
  }
</style>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const U = (v) => String(v == null ? '' : v).trim().toUpperCase();
  const T = (v) => String(v == null ? '' : v).trim();
  const AKTIF = ['BELUM BAYAR', 'BELUM LUNAS'];
  const kabOf = (r) => T(r.Kabupaten ?? r.kabupaten) || '(Tidak Terdeteksi)';
  const UX = { kp: '', kab: '', reg: 'ALL', sk: '', ready: false, list: [] };
  let startQ = location.hash.startsWith('#progres') ? new URLSearchParams(location.hash.split('?')[1] || '') : null;

  /* ---------- KP & Kabupaten ikut memfilter KPI, tren, dan perbandingan bulan lalu ---------- */
  const baseMatch = window.rowMatchesBillingType;
  window.rowMatchesBillingType = (r) => baseMatch(r)
    && (!UX.kp || U(r.KP) === U(UX.kp))
    && (!UX.kab || U(kabOf(r)) === U(UX.kab));

  /* animasi transisi lebih singkat */
  window.triggerActionAnimation = (cb) => {
    const w = $('dashboardWrapper');
    w.classList.add('is-animating');
    setTimeout(() => { try { cb(); } finally { setTimeout(() => w.classList.remove('is-animating'), 30); } }, 120);
  };

  const val = () => ({ t: currentBillingType, p: $('filterPeriode').value, r: $('progFilterRegion').value,
    s: $('progStartDate').value, e: $('progEndDate').value });

  function toast(m) {
    const d = document.createElement('div');
    d.textContent = m;
    d.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 z-[4000] px-4 py-2 rounded-xl bg-slate-800 text-white text-xs font-semibold';
    document.body.appendChild(d); setTimeout(() => d.remove(), 2600);
  }

  /* ---------- sinkron pilihan KP ke peta ---------- */
  function syncMapKp() {
    const s = document.querySelector('#progresMapMount [data-r="kp"]');
    if (!s) return;
    const o = UX.kp ? [...s.options].find((x) => U(x.value) === U(UX.kp)) : null;
    const v = o ? o.value : 'ALL';
    if (s.value !== v) { s.value = v; s.dispatchEvent(new Event('change')); }
  }

  /* ---------- bangun elemen tambahan (sekali) ---------- */
  function build() {
    const fc = $('filterPeriode').closest('.bg-white');
    fc.id = 'uxFilter';
    fc.insertAdjacentHTML('beforeend',
      '<div id="uxChips" class="flex flex-wrap gap-2 pt-2 border-t border-slate-100"></div>' +
      '<p class="text-xs text-slate-500">Filter Tgl Lunas berlaku untuk KPI, tren, dan leaderboard. Peta selalu menampilkan tunggakan aktif saat ini.</p>');
    $('progEndDate').parentElement.insertAdjacentHTML('afterend',
      '<div class="flex gap-1.5">' + [['today', 'Hari ini'], ['7', '7 hari'], ['month', 'Bulan ini']]
        .map(([k, t]) => `<button type="button" class="ux-btn" data-ux-pre="${k}">${t}</button>`).join('') + '</div>');

    $('progTargetRp').closest('.grid').id = 'secKpi';
    $('progresTrenChart').closest('.bg-white').id = 'secTren';
    $('progresBody').closest('.bg-white').id = 'secBoard';
    fc.insertAdjacentHTML('afterend',
      '<nav class="flex gap-2 overflow-x-auto hide-scrollbar" aria-label="Loncat ke bagian">' +
      [['secKpi', 'Ringkasan'], ['secTren', 'Tren'], ['progresMapMount', 'Peta'], ['secBoard', 'Leaderboard']]
        .map(([id, t]) => `<button type="button" class="ux-btn whitespace-nowrap" data-ux-nav="${id}">${t}</button>`).join('') + '</nav>');
    $('secBoard').querySelector('.overflow-x-auto').insertAdjacentHTML('beforebegin',
      '<div id="uxCrumb" class="flex flex-wrap items-center justify-between gap-2 mb-3"></div>');
  }

  /* ---------- chip filter aktif ---------- */
  function chips() {
    const f = val(), L = { prepaid: 'Prabayar', postpaid: 'Pascabayar', all: 'Semua tagihan' };
    const d = (x) => x.split('-').reverse().join('/');
    const add = (txt, key) => `<span class="ux-chip">${escapeHtml(txt)}<button type="button" data-ux-x="${key}" aria-label="Hapus filter ${escapeHtml(txt)}">×</button></span>`;
    $('uxChips').innerHTML = `<span class="ux-chip base">${L[f.t]}</span>`
      + (f.p !== 'ALL' ? add(f.p, 'p') : '')
      + (f.r !== 'ALL' ? add('Region ' + f.r, 'r') : '')
      + (UX.kp ? add('KP ' + UX.kp, 'kp') : '')
      + (UX.kab ? add(UX.kab, 'kab') : '')
      + (f.s || f.e ? add('Tgl Lunas ' + (f.s ? d(f.s) : '…') + ' – ' + (f.e ? d(f.e) : '…'), 'd') : '');
  }

  /* ---------- leaderboard drill-down: Nasional > Region > KP > Kabupaten ---------- */
  function board() {
    const f = val();
    const level = f.r === 'ALL' ? 'region' : UX.kp ? 'kab' : 'kp';
    const map = {};
    allData.progres.filter((r) => baseMatch(r)
      && (f.p === 'ALL' || T(r.Periode) === f.p)
      && (level === 'region' || U(r.Region) === U(f.r))
      && (level !== 'kab' || U(r.KP) === U(UX.kp))
    ).forEach((r) => {
      const k = level === 'region' ? U(r.Region) : level === 'kp' ? (T(r.KP) || '(Kosong)') : kabOf(r);
      if (!k) return;
      const o = map[k] || (map[k] = { k, tp: 0, tr: 0, lp: 0, lr: 0 });
      const p = Number(r.Jumlah_Pelanggan) || 0, v = Number(r.Jumlah_Rupiah) || 0;
      o.tp += p; o.tr += v;
      if (isLunasInRange(r, f.s, f.e)) { o.lp += p; o.lr += v; }
    });
    const list = Object.values(map).map((o) => ({ ...o, pct: o.tp ? (o.lp / o.tp) * 100 : 0 }))
      .sort((a, b) => b.pct - a.pct || b.lp - a.lp);
    UX.list = list;

    const card = $('secBoard');
    const h3 = card.querySelector('h3');
    h3.lastChild.textContent = ' Leaderboard ' + { region: 'Region', kp: 'KP · Region ' + f.r, kab: 'Kabupaten/Kota · KP ' + UX.kp }[level];
    card.querySelector('th').textContent = { region: 'Region', kp: 'Kantor Perwakilan (KP)', kab: 'Kabupaten / Kota' }[level];

    const bc = (lv, t) => `<button type="button" class="ux-btn" data-ux-bc="${lv}">${escapeHtml(t)}</button>`;
    const crumb = [bc('region', 'Nasional')];
    if (f.r !== 'ALL') crumb.push(bc('kp', f.r));
    if (UX.kp) crumb.push(bc('kab', UX.kp));
    $('uxCrumb').innerHTML = `<nav aria-label="Jalur" class="flex flex-wrap items-center gap-1.5">${crumb.join('<span class="text-slate-400">›</span>')}</nav>`
      + '<button type="button" class="ux-btn" data-ux-csv>Unduh CSV</button>';

    $('progresBody').innerHTML = list.map((o, i) => {
      const on = level === 'kab' && UX.kab && U(UX.kab) === U(o.k);
      const bad = o.pct >= 100 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700';
      return `<tr data-ux-lv="${level}" data-ux-k="${escapeHtml(o.k)}" tabindex="0" class="animate-row cursor-pointer border-b border-slate-100 hover:bg-rose-50/60 ${on ? 'bg-rose-50' : ''}" style="animation-delay:${Math.min(i, 20) * 25}ms">
        <td class="py-2.5 px-3 w-4/12"><div class="flex items-center gap-2 font-bold text-slate-700 text-xs sm:text-sm"><span class="w-5 text-center text-slate-500">${i < 3 ? '<span class="text-amber-500">★</span>' : i + 1}</span><span class="truncate">${escapeHtml(o.k)}</span><span class="ml-auto text-slate-400">›</span></div></td>
        <td class="py-2.5 px-3 w-3/12 text-center whitespace-nowrap"><div class="text-xs sm:text-sm font-semibold text-slate-700">${o.lp.toLocaleString('id-ID')}</div><div class="text-[11px] text-slate-400">dari ${o.tp.toLocaleString('id-ID')}</div></td>
        <td class="py-2.5 px-3 w-3/12 text-center whitespace-nowrap"><div class="text-xs sm:text-sm font-semibold text-slate-700">${formatRupiah(o.lr)}</div><div class="text-[11px] text-slate-400">dari ${formatRupiah(o.tr)}</div></td>
        <td class="py-2.5 px-3 w-2/12 text-right whitespace-nowrap"><span class="inline-block px-2 py-1 rounded-md text-xs sm:text-sm font-bold ${bad}">${o.pct.toFixed(1)}%</span></td></tr>`;
    }).join('') || '<tr><td colspan="4" class="p-4 text-center text-slate-500">Belum ada data untuk filter ini. Hapus salah satu chip filter di atas.</td></tr>';
  }

  function csv() {
    const rows = [['Nama', 'Pelanggan Lunas', 'Pelanggan Ditagih', 'Revenue Lunas', 'Revenue Ditagih', 'Capaian %'],
      ...UX.list.map((o) => [o.k, o.lp, o.tp, o.lr, o.tr, o.pct.toFixed(1)])];
    const txt = '\uFEFF' + rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
    a.download = 'progres-tagihan-' + toYMD(new Date()) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function saveHash() {
    const f = val();
    try { history.replaceState(null, '', '#progres?' + new URLSearchParams({ t: f.t, p: f.p, r: f.r, kp: UX.kp, kab: UX.kab, s: f.s, e: f.e })); } catch (_) { /* iframe */ }
  }

  /* ---------- perbaikan KPI setelah filter diterapkan ---------- */
  function after() {
    if (!$('uxChips')) return;
    const f = val();
    // 1) Tunggakan aktif jadi angka utama (konsisten dengan peta), lengkap dengan Rp
    let plg = 0, rp = 0;
    allData.progres.filter((r) => window.rowMatchesBillingType(r)
      && (f.p === 'ALL' || T(r.Periode) === f.p)
      && (f.r === 'ALL' || U(r.Region) === U(f.r))
    ).forEach((r) => { if (AKTIF.includes(U(r.Status))) { plg += Number(r.Jumlah_Pelanggan) || 0; rp += Number(r.Jumlah_Rupiah) || 0; } });
    $('progSisaRp').previousElementSibling.textContent = 'Tunggakan Aktif (Belum Bayar)';
    animateCounter('progSisaRp', rp, true);
    animateCounter('progSisaPlg', plg, false, 'Pelanggan Tunggakan Aktif');

    const row = $('detAktif').parentElement;
    row.classList.add('cursor-pointer', 'hover:underline');
    row.onclick = () => $('progresMapMount').scrollIntoView({ behavior: 'smooth' });
    row.firstElementChild.lastChild.textContent = ' Lihat sebaran di peta';
    $('detAktif').textContent = '↓';
    if (!$('uxCap')) row.nextElementSibling.insertAdjacentHTML('beforebegin',
      '<p id="uxCap" class="text-[11px] text-slate-400 pt-1">Tidak ditagih lagi (bukan tunggakan aktif):</p>');

    // 2) Perbandingan bulan lalu jadi badge di kartu Lunas
    if (!$('uxMom')) $('progLunasPlg').insertAdjacentHTML('afterend', '<p id="uxMom" class="text-xs font-semibold mt-1"></p>');
    const mb = $('momBadge'), has = !mb.classList.contains('hidden');
    $('uxMom').textContent = has ? mb.textContent.trim() + ' dibanding bulan lalu' : '';
    $('uxMom').title = $('momSubTitle').textContent;
    $('uxMom').className = 'text-xs font-semibold mt-1 ' + (mb.textContent.includes('▲') ? 'text-emerald-600' : 'text-rose-600');

    // 3) Definisi Capaian
    if (!$('uxDef')) {
      const h = $('labelCapaianTeks').parentElement;
      h.insertAdjacentHTML('beforeend', ' <button type="button" id="uxDef" class="ux-btn" style="padding:0 7px" aria-label="Definisi Capaian" onclick="document.getElementById(\'uxDefTx\').classList.toggle(\'hidden\')">ⓘ</button>');
      h.parentElement.insertAdjacentHTML('beforeend',
        '<p id="uxDefTx" class="hidden text-xs text-slate-500 mt-1">Capaian = pelanggan lunas ÷ pelanggan ditagih (berbasis jumlah pelanggan). Di tab Pencapaian Collection, capaian berbasis Rupiah.</p>');
    }

    chips(); board(); saveHash();
    if (UX.kp !== UX.sk) { UX.sk = UX.kp; setTimeout(syncMapKp, 350); }
  }

  /* ---------- bungkus fungsi bawaan ---------- */
  const baseApply = window.applyProgresFilter;
  window.applyProgresFilter = function () {
    const s = $('progStartDate'), e = $('progEndDate');
    if (s.value && e.value && s.value > e.value) { [s.value, e.value] = [e.value, s.value]; toast('Tanggal mulai dan akhir tertukar, sudah saya balik.'); }
    const reg = U($('progFilterRegion').value);
    if (reg !== UX.reg) { UX.reg = reg; UX.kp = UX.kab = ''; }
    baseApply();
    after();
  };

  const baseSet = window.setBillingType;
  window.setBillingType = function (type) {
    if (type !== currentBillingType) UX.kp = UX.kab = '';
    return baseSet.apply(this, arguments);
  };

  const baseReset = window.resetProgresFilter;
  window.resetProgresFilter = function () { UX.kp = UX.kab = ''; UX.reg = 'ALL'; baseReset(); };

  /* filter tidak ter-reset lagi saat pindah tab atau klik Sinkronkan Data */
  const baseInit = window.initProgresTab;
  window.initProgresTab = function () {
    if (!UX.ready) {
      UX.ready = true;
      baseInit();
      const c = document.querySelector('#progresMapMount [data-r="ctx"]');
      if (c) c.insertAdjacentHTML('afterend', '<p class="text-[11px] text-amber-700 mt-0.5">Peta hanya menampilkan tunggakan aktif. Filter Tgl Lunas tidak berlaku di sini.</p>');
      if (startQ) {
        const q = startQ; startQ = null;
        const t = q.get('t');
        if (['prepaid', 'postpaid', 'all'].includes(t) && t !== currentBillingType) window.setBillingType(t, false);
        const setSel = (id, v) => { const s = $(id); if (v && [...s.options].some((o) => o.value === v)) s.value = v; };
        setSel('filterPeriode', q.get('p')); setSel('progFilterRegion', q.get('r'));
        $('progStartDate').value = q.get('s') || ''; $('progEndDate').value = q.get('e') || '';
        UX.reg = U($('progFilterRegion').value); UX.kp = q.get('kp') || ''; UX.kab = q.get('kab') || '';
        window.applyProgresFilter();
      }
      return;
    }
    $('progFilterRegion').innerHTML = '<option value="ALL">Semua Region</option>' +
      [...new Set(allData.progres.map((r) => r.Region).filter(Boolean))].sort()
        .map((x) => `<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('');
    ProgresMap.setProgresData(allData.progres);
    window.setBillingType(currentBillingType, false);
  };

  /* buka langsung ke tab Progres bila ada tautan berisi filter */
  const baseLoad = window.loadAllData;
  window.loadAllData = async function () { await baseLoad(); if (startQ) switchTab('progres'); };

  /* ---------- semua klik ---------- */
  document.addEventListener('click', (e) => {
    const g = (sel) => e.target.closest(sel);
    let el;
    if ((el = g('[data-ux-x]'))) {
      const k = el.dataset.uxX;
      if (k === 'p') $('filterPeriode').value = 'ALL';
      else if (k === 'r') { $('progFilterRegion').value = 'ALL'; UX.kp = UX.kab = ''; }
      else if (k === 'kp') UX.kp = UX.kab = '';
      else if (k === 'kab') UX.kab = '';
      else { $('progStartDate').value = ''; $('progEndDate').value = ''; }
      return applyProgresFilter();
    }
    if ((el = g('[data-ux-bc]'))) {
      const lv = el.dataset.uxBc;
      if (lv === 'region') { $('progFilterRegion').value = 'ALL'; UX.kp = UX.kab = ''; }
      else if (lv === 'kp') UX.kp = UX.kab = '';
      else UX.kab = '';
      return applyProgresFilter();
    }
    if ((el = g('#progresBody tr[data-ux-lv]'))) {
      const lv = el.dataset.uxLv, k = el.dataset.uxK;
      if (lv === 'region') {
        const o = [...$('progFilterRegion').options].find((x) => U(x.value) === U(k));
        if (o) $('progFilterRegion').value = o.value;
        UX.kp = UX.kab = '';
      } else if (lv === 'kp') { UX.kp = k; UX.kab = ''; }
      else UX.kab = U(UX.kab) === U(k) ? '' : k;
      return applyProgresFilter();
    }
    if ((el = g('[data-ux-pre]'))) {
      const n = new Date(), s = new Date(n), k = el.dataset.uxPre;
      if (k === '7') s.setDate(n.getDate() - 6); else if (k === 'month') s.setDate(1);
      $('progStartDate').value = toYMD(s); $('progEndDate').value = toYMD(n);
      return applyProgresFilter();
    }
    if ((el = g('[data-ux-nav]'))) return $(el.dataset.uxNav).scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (g('[data-ux-csv]')) return csv();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches && e.target.matches('#progresBody tr[data-ux-lv]')) e.target.click();
  });

  build();
})();
</script>

<!-- ============================================================
  2 PERUBAHAN MANUAL di kode asli (satu baris masing-masing):
  1) Fungsi animateCounter: ubah  const duration = 1200;  menjadi  const duration = 400;
  2) Modul peta, objek I (ikon layar penuh): ubah  M20 15v5-5  menjadi  M20 15v5h-5
============================================================ --></body>
</html>
